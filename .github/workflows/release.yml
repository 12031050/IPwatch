name: Publish FPK release

on:
  push:
    branches: [main]
    paths:
      - manifest
      - dist/*.fpk
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and release notes
        id: meta
        shell: bash
        run: |
          python3 - <<'PY' > release_meta.txt
          import pathlib, re
          text = pathlib.Path('manifest').read_text(encoding='utf-8')
          version = re.search(r'^version\s*=\s*(\S+)', text, re.M).group(1)
          changelog = re.search(r'^changelog\s*=\s*(.*)$', text, re.M).group(1)
          match = re.search(r'^' + re.escape(version) + r'\s+(.*?)(?=\d+\.\d+\.\d+\s|$)', changelog)
          notes = match.group(1).strip() if match else 'See manifest changelog.'
          print(version)
          print(notes)
          PY
          {
            echo "version=$(sed -n '1p' release_meta.txt)"
            echo 'notes<<EOF'
            sed -n '2,$p' release_meta.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with FPK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          FPK="dist/ipwatch_v${VERSION}.fpk"
          test -f "$FPK" || { echo "FPK not found: $FPK"; exit 1; }
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keep existing assets untouched."
          else
            gh release create "$TAG" "$FPK" --title "IPwatch $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
            echo "Published $TAG with $FPK"
          fi
